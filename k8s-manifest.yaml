apiVersion: v1
kind: Namespace
metadata:
  name: anomalygate
---
# Zookeeper
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zookeeper
  namespace: anomalygate
spec:
  selector:
    matchLabels:
      app: zookeeper
  template:
    metadata:
      labels:
        app: zookeeper
    spec:
      containers:
      - name: zookeeper
        image: confluentinc/cp-zookeeper:7.4.4
        ports:
        - containerPort: 2181
        env:
        - name: ZOOKEEPER_CLIENT_PORT
          value: "2181"
        - name: ZOOKEEPER_TICK_TIME
          value: "2000"
        - name: KAFKA_HEAP_OPTS
          value: "-Xmx256M -Xms256M"
---
apiVersion: v1
kind: Service
metadata:
  name: zookeeper
  namespace: anomalygate
spec:
  ports:
  - port: 2181
    targetPort: 2181
  selector:
    app: zookeeper
---
# Kafka
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: anomalygate
spec:
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      enableServiceLinks: false
      containers:
      - name: kafka
        image: confluentinc/cp-kafka:7.4.4
        ports:
        - containerPort: 9092
        - containerPort: 29092
        env:
        - name: KAFKA_BROKER_ID
          value: "1"
        - name: KAFKA_ZOOKEEPER_CONNECT
          value: "zookeeper:2181"
        - name: KAFKA_LISTENERS
          value: "PLAINTEXT://0.0.0.0:9092,CONNECTOR://0.0.0.0:29092"
        - name: KAFKA_ADVERTISED_LISTENERS
          value: "PLAINTEXT://localhost:9092,CONNECTOR://kafka:29092"
        - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
          value: "PLAINTEXT:PLAINTEXT,CONNECTOR:PLAINTEXT"
        - name: KAFKA_INTER_BROKER_LISTENER_NAME
          value: "CONNECTOR"
        - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
          value: "1"
        - name: KAFKA_HEAP_OPTS
          value: "-Xmx512M -Xms512M"
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: anomalygate
spec:
  type: NodePort
  ports:
  - name: plaintext
    port: 9092
    targetPort: 9092
    nodePort: 30092
  - name: connector
    port: 29092
    targetPort: 29092
  selector:
    app: kafka
---
# Elasticsearch
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch
  namespace: anomalygate
spec:
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
    spec:
      containers:
      - name: elasticsearch
        image: docker.elastic.co/elasticsearch/elasticsearch:8.11.1
        ports:
        - containerPort: 9200
        env:
        - name: discovery.type
          value: "single-node"
        - name: xpack.security.enabled
          value: "false"
        - name: ES_JAVA_OPTS
          value: "-Xms512m -Xmx512m"
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: anomalygate
spec:
  type: NodePort
  ports:
  - port: 9200
    targetPort: 9200
    nodePort: 30200
  selector:
    app: elasticsearch
---
# Kibana
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana
  namespace: anomalygate
spec:
  selector:
    matchLabels:
      app: kibana
  template:
    metadata:
      labels:
        app: kibana
    spec:
      containers:
      - name: kibana
        image: docker.elastic.co/kibana/kibana:8.11.1
        ports:
        - containerPort: 5601
        env:
        - name: ELASTICSEARCH_HOSTS
          value: "http://elasticsearch:9200"
        - name: NODE_OPTIONS
          value: "--max-old-space-size=512"
---
apiVersion: v1
kind: Service
metadata:
  name: kibana
  namespace: anomalygate
spec:
  type: NodePort
  ports:
  - port: 5601
    targetPort: 5601
    nodePort: 30601
  selector:
    app: kibana
---
# Logstash ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: logstash-config
  namespace: anomalygate
data:
  logstash.conf: |
    input {
      kafka {
        bootstrap_servers => "kafka:29092"
        topics => ["siem-critical-logs"]
        codec => "json"
        auto_offset_reset => "earliest"
      }
    }

    filter {
      # Clean up PySpark math vector arrays before indexing to Elasticsearch
      mutate {
        remove_field => ["features", "raw_features", "level_idx", "logger_idx", "cluster_prediction"]
      }
    }

    output {
      elasticsearch {
        hosts => ["http://elasticsearch:9200"]
        index => "anomalygate-alerts-%{+YYYY.MM.dd}"
      }
      
      # Prints out formatted alerts in your terminal console logs
      stdout { codec => rubydebug }
    }
---
# Logstash
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logstash
  namespace: anomalygate
spec:
  selector:
    matchLabels:
      app: logstash
  template:
    metadata:
      labels:
        app: logstash
    spec:
      containers:
      - name: logstash
        image: docker.elastic.co/logstash/logstash:8.11.1
        env:
        - name: LS_JAVA_OPTS
          value: "-Xms512m -Xmx512m"
        volumeMounts:
        - name: config-volume
          mountPath: /usr/share/logstash/pipeline/logstash.conf
          subPath: logstash.conf
      volumes:
      - name: config-volume
        configMap:
          name: logstash-config
---
# NGINX API Gateway ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-gateway-config
  namespace: anomalygate
data:
  nginx.conf: |
    events {
        worker_connections 1024;
    }

    http {
        server {
            listen 80;
            
            # Kibana UI
            location / {
                proxy_pass http://kibana:5601;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            }
        }

        server {
            listen 9200;
            
            # Elasticsearch API
            location / {
                proxy_pass http://elasticsearch:9200;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            }
        }
    }

    stream {
        # Kafka TCP Stream
        server {
            listen 9092;
            proxy_pass kafka:9092;
        }
    }
---
# NGINX API Gateway Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-gateway
  namespace: anomalygate
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-gateway
  template:
    metadata:
      labels:
        app: nginx-gateway
    spec:
      containers:
      - name: nginx
        image: nginx:1.25
        ports:
        - containerPort: 80
        - containerPort: 9200
        - containerPort: 9092
        volumeMounts:
        - name: nginx-config-volume
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
      volumes:
      - name: nginx-config-volume
        configMap:
          name: nginx-gateway-config
---
# NGINX API Gateway Service
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: anomalygate
spec:
  type: LoadBalancer
  ports:
  - name: http-kibana
    port: 80
    targetPort: 80
  - name: http-elastic
    port: 9200
    targetPort: 9200
  - name: tcp-kafka
    port: 9092
    targetPort: 9092
  selector:
    app: nginx-gateway
